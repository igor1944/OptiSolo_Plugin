help-user:
  - "&8&m----------------&a OptiSolo &8&m----------------"
  - "&a/solo &7— открыть меню мира"
  - "&a/solo create [normal|flat|void] &7— создать свой мир 10k x 10k"
  - "&a/solo go &7— телепорт в свой мир &8| &a/solo leave &7— вернуться"
  - "&a/solo invite <ник> &7— пригласить друга"
  - "&a/solo accept <ник> &7— принять приглашение"
  - "&a/solo visit <ник> &7— зайти в мир друга"
  - "&a/solo trust <ник> &7— доверенный (может строить)"
  - "&a/solo untrust <ник> &7— убрать доверенного"
  - "&a/solo sethome <название> &7— точка телепорта"
  - "&a/solo home [название] &7— телепорт на точку"
  - "&a/solo delhome <название> &7— удалить точку"
  - "&a/solo kit &7— стартовый набор"
  - "&a/solo time <day|night> &7— время в своём мире"
  - "&a/solo weather <clear|rain> &7— погода в своём мире"
  - "&a/solo difficulty <easy|normal|...> &7— сложность"
  - "&a/solo public &7/ &a/solo private &7— открытый/закрытый мир"
  - "&a/solo report <ник> <причина> &7— пожаловаться"
  - "&a/solo delete &7— удалить свой мир"
help-admin:
  - "&8&m----------------&c OptiSolo Admin &8&m----------------"
  - "&c/solo admin list &7— все миры"
  - "&c/solo admin info <ник> &7— инфо о мире"
  - "&c/solo admin tp <ник> &7— телепорт в чужой мир"
  - "&c/solo admin delete <ник> &7— удалить чужой мир"
  - "&c/solo reports &7— жалобы (ЛКМ закрыть, Shift+ЛКМ удалить)"
  - "&c/solo reportclose <id> &7— закрыть жалобу"
  - "&c/solo reportdelete <id> &7— удалить жалобу"
  - "&c/solo reload &7— перезагрузить конфиг"

